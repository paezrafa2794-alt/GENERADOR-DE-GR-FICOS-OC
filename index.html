<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curvas OC para ANOVA</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#14213d;--mut:#5b6b82;--line:#d6dee9;--acc:#0b6e99;--warn:#c2410c;--ok:#1b7a4b;--c1:#9fb8cf;--c2:#7fa0bf;--c3:#5f88ad;--c4:#44709b;--c5:#2f5985;--c6:#1f456f;--c7:#14335a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--card:#16212f;--ink:#e6edf6;--mut:#93a4bb;--line:#2a3a50;--acc:#5bb8e0;--warn:#fb923c;--ok:#4ade80;--c1:#35506b;--c2:#44648a;--c3:#5580ab;--c4:#6a9bc6;--c5:#82b0d6;--c6:#9bc3e2;--c7:#b5d4ec}}
:root[data-theme="dark"]{--bg:#0e1622;--card:#16212f;--ink:#e6edf6;--mut:#93a4bb;--line:#2a3a50;--acc:#5bb8e0;--warn:#fb923c;--ok:#4ade80;--c1:#35506b;--c2:#44648a;--c3:#5580ab;--c4:#6a9bc6;--c5:#82b0d6;--c6:#9bc3e2;--c7:#b5d4ec}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px;max-width:62ch}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label:first-child{margin-top:0}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0e1622}}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.stat b{display:block;font:600 22px/1.2 Georgia,serif}
.stat span{font-size:12px;color:var(--mut)}
.stat.main{border-color:var(--acc)}
.stat.main b{color:var(--acc);font-size:28px}
h2{font:600 15px/1.3 system-ui,sans-serif;margin:0 0 8px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mut);font:11px system-ui,sans-serif}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500}
tr.hit td{background:color-mix(in srgb,var(--ok) 14%,transparent);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:16px;height:3px;margin-right:5px;vertical-align:middle;border-radius:2px}
.err{color:var(--warn);font-size:14px}
.stack>*+*{margin-top:16px}
</style>
</head>
<body>
<main>
<h1>Curvas características de operación (OC)</h1>
<p class="sub">ANOVA de un factor con efectos fijos. Captura los datos del ejercicio y obtén el tamaño de muestra n, la potencia y las gráficas.</p>
<div class="grid">
<section class="card">
<label for="a">Número de tratamientos (a = k)</label>
<input id="a" type="number" min="2" step="1" value="4">
<label for="mode">Tipo de dato del efecto</label>
<select id="mode"><option value="tau">Suma de desviaciones cuadráticas (Στᵢ²)</option><option value="D">Diferencia mínima entre dos medias (D)</option></select>
<label for="eff" id="efflab">Στᵢ²</label>
<input id="eff" type="number" step="any" value="1016.75">
<div class="hint" id="effh">Con D se usa Στᵢ² = D²/2.</div>
<label for="sig">Desviación estándar (σ)</label>
<input id="sig" type="number" step="any" min="0" value="45.17">
<label for="al">Nivel de significancia (α)</label>
<input id="al" type="number" step="any" min="0.0001" max="0.5" value="0.05">
<label for="pw">Potencia mínima (1 − β)</label>
<input id="pw" type="number" step="any" min="0.5" max="0.999" value="0.90">
<label for="ne">n a evaluar (opcional)</label>
<input id="ne" type="number" step="1" min="2" placeholder="vacío = n mínimo">
<button id="go" type="button">Calcular y graficar</button>
<p class="err" id="err" role="alert"></p>
</section>
<div class="stack">
<div class="stats" id="stats"></div>
<section class="card"><h2>Curvas OC: β contra Φ</h2><div id="oc"></div><div class="leg" id="leg"></div></section>
<section class="card"><h2>Potencia contra n por tratamiento</h2><div id="pc"></div></section>
<section class="card"><h2>Iteraciones cerca del n requerido</h2><div class="tw" id="tb"></div></section>
</div>
</div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bcf(x,a,b){const F=1e-300,qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<F)d=F;d=1/d;let h=d;for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-14)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(x,a,b)/a:1-bt*bcf(1-x,b,a)/b}
const fcdf=(x,v1,v2)=>ib(v1*x/(v1*x+v2),v1/2,v2/2);
function fq(p,v1,v2){let lo=0,hi=1;while(fcdf(hi,v1,v2)<p)hi*=2;for(let i=0;i<60;i++){const m=(lo+hi)/2;fcdf(m,v1,v2)<p?lo=m:hi=m}return(lo+hi)/2}
function ncf(x,v1,v2,lam){if(lam<1e-9)return fcdf(x,v1,v2);const mu=lam/2,y=v1*x/(v1*x+v2),J=Math.ceil(mu+10*Math.sqrt(mu)+40);let s=0;for(let j=0;j<=J;j++){s+=Math.exp(-mu+j*Math.log(mu)-lg(j+1))*ib(y,v1/2+j,v2/2)}return Math.min(1,s)}
let A,C,AL,PW;
const betaN=n=>{const v2=A*(n-1);return ncf(fq(1-AL,A-1,v2),A-1,v2,n*C)};
const betaPhi=(phi,v2)=>ncf(fq(1-AL,A-1,v2),A-1,v2,A*phi*phi);
const f3=x=>x.toFixed(3),f4=x=>x.toFixed(4);
const NS="http://www.w3.org/2000/svg";
function svgOC(phiStar,bStar,v2Star){
 const W=640,H=340,m={l:52,r:14,t:12,b:40},w=W-m.l-m.r,h=H-m.t-m.b,x0=0.3,x1=Math.max(3.5,phiStar+0.8),ymin=0.003;
 const X=p=>m.l+(p-x0)/(x1-x0)*w,Y=b=>m.t+(0-Math.log10(Math.max(b,ymin)))/(0-Math.log10(ymin))*h;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curvas OC">`;
 for(const b of [1,.3,.1,.03,.01,.003]){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(b)}" y2="${Y(b)}" style="stroke:var(--line)"/><text x="${m.l-6}" y="${Y(b)+4}" text-anchor="end">${b}</text>`}
 for(let p=Math.ceil(x0*2)/2;p<=x1;p+=0.5){s+=`<line x1="${X(p)}" x2="${X(p)}" y1="${m.t}" y2="${m.t+h}" style="stroke:var(--line)"/><text x="${X(p)}" y="${m.t+h+16}" text-anchor="middle">${p}</text>`}
 s+=`<text x="${m.l+w/2}" y="${H-6}" text-anchor="middle">Φ</text><text transform="translate(12 ${m.t+h/2}) rotate(-90)" text-anchor="middle">β (escala logarítmica)</text>`;
 const list=[6,10,20,30,60,120,3000],leg=[];
 list.forEach((v,i)=>{let d="";for(let k=0;k<=70;k++){const p=x0+(x1-x0)*k/70;d+=(k?"L":"M")+X(p).toFixed(1)+" "+Y(betaPhi(p,v)).toFixed(1)}
  s+=`<path d="${d}" fill="none" style="stroke:var(--c${i+1})" stroke-width="1.6"/>`;leg.push([`var(--c${i+1})`,v>=3000?"ν₂ = ∞":"ν₂ = "+v])});
 if(!list.includes(v2Star)){let d="";for(let k=0;k<=70;k++){const p=x0+(x1-x0)*k/70;d+=(k?"L":"M")+X(p).toFixed(1)+" "+Y(betaPhi(p,v2Star)).toFixed(1)}
  s+=`<path d="${d}" fill="none" style="stroke:var(--acc)" stroke-width="2.4" stroke-dasharray="6 3"/>`;leg.push(["var(--acc)","ν₂ = "+v2Star+" (tu ejercicio)"])}
 s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(1-PW)}" y2="${Y(1-PW)}" style="stroke:var(--warn)" stroke-dasharray="4 4" stroke-width="1.4"/><text x="${W-m.r-4}" y="${Y(1-PW)-5}" text-anchor="end" style="fill:var(--warn)">β = ${+(1-PW).toFixed(3)}</text>`;
 const px=X(phiStar),py=Y(bStar);
 s+=`<circle cx="${px}" cy="${py}" r="5.5" style="fill:var(--ink)"/><text x="${Math.min(px+10,W-80)}" y="${py-10}" style="fill:var(--ink);font-weight:600">Φ = ${phiStar.toFixed(2)}, β = ${bStar.toFixed(3)}</text></svg>`;
 $("oc").innerHTML=s;$("leg").innerHTML=leg.map(l=>`<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join("");
}
function svgPW(nEval,nStar){
 const W=640,H=280,m={l:52,r:14,t:12,b:40},w=W-m.l-m.r,h=H-m.t-m.b,nMax=Math.max(15,Math.max(nEval,nStar)+10);
 const X=n=>m.l+(n-2)/(nMax-2)*w,Y=p=>m.t+(1-p)*h;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Potencia contra n">`;
 for(const p of [0,.2,.4,.6,.8,1]){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(p)}" y2="${Y(p)}" style="stroke:var(--line)"/><text x="${m.l-6}" y="${Y(p)+4}" text-anchor="end">${p}</text>`}
 const step=nMax>40?10:5;for(let n=step;n<=nMax;n+=step)s+=`<text x="${X(n)}" y="${m.t+h+16}" text-anchor="middle">${n}</text>`;
 s+=`<text x="${m.l+w/2}" y="${H-6}" text-anchor="middle">n por tratamiento</text><text transform="translate(12 ${m.t+h/2}) rotate(-90)" text-anchor="middle">Potencia (1 − β)</text>`;
 let d="";const pts=[];for(let n=2;n<=nMax;n++){const p=1-betaN(n);pts.push([n,p]);d+=(n>2?"L":"M")+X(n).toFixed(1)+" "+Y(p).toFixed(1)}
 s+=`<path d="${d}" fill="none" style="stroke:var(--acc)" stroke-width="2.2"/>`;
 pts.forEach(q=>s+=`<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="2.2" style="fill:var(--acc)"/>`);
 s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(PW)}" y2="${Y(PW)}" style="stroke:var(--warn)" stroke-dasharray="4 4" stroke-width="1.4"/><text x="${W-m.r-4}" y="${Y(PW)-5}" text-anchor="end" style="fill:var(--warn)">potencia mínima ${PW}</text>`;
 const pe=1-betaN(nEval);s+=`<circle cx="${X(nEval)}" cy="${Y(pe)}" r="5.5" style="fill:var(--ink)"/><text x="${X(nEval)+9}" y="${Y(pe)+16}" style="fill:var(--ink);font-weight:600">n = ${nEval}, ${pe.toFixed(3)}</text></svg>`;
 $("pc").innerHTML=s;
}
function run(){
 const err=$("err");err.textContent="";
 A=Math.round(+$("a").value);const mode=$("mode").value,e=+$("eff").value,sg=+$("sig").value;AL=+$("al").value;PW=+$("pw").value;
 if(!(A>=2)||!(e>0)||!(sg>0)||!(AL>0&&AL<.5)||!(PW>.5&&PW<1)){err.textContent="Revisa los datos: a ≥ 2, efecto y σ positivos, 0 < α < 0.5 y 0.5 < potencia < 1.";return}
 const S=mode==="D"?e*e/2:e;C=S/(sg*sg);
 let n=2;while(1-betaN(n)<PW&&n<400)n++;
 if(n>=400){err.textContent="Con estos datos se requieren más de 400 observaciones por tratamiento; revisa el efecto o σ.";return}
 const ne=Math.round(+$("ne").value)>=2?Math.round(+$("ne").value):n;
 const phi=Math.sqrt(ne*C/A),b=betaN(ne),v2=A*(ne-1);
 $("stats").innerHTML=`<div class="stat main"><b>${n}</b><span>n mínimo por tratamiento</span></div><div class="stat"><b>${A*n}</b><span>observaciones totales (a·n)</span></div><div class="stat"><b>${f3(phi)}</b><span>Φ con n = ${ne}</span></div><div class="stat"><b>${A-1} y ${v2}</b><span>ν₁ y ν₂</span></div><div class="stat"><b>${f4(b)}</b><span>β con n = ${ne}</span></div><div class="stat"><b>${f4(1-b)}</b><span>potencia con n = ${ne}</span></div>`;
 svgOC(phi,b,v2);svgPW(ne,n);
 let rows="<table><tr><th>n</th><th>ν₂</th><th>Φ</th><th>β</th><th>Potencia</th><th>¿Cumple?</th></tr>";
 for(let k=Math.max(2,n-4);k<=n+2;k++){const bk=betaN(k);rows+=`<tr class="${k===n?"hit":""}"><td>${k}</td><td>${A*(k-1)}</td><td>${f3(Math.sqrt(k*C/A))}</td><td>${f4(bk)}</td><td>${f4(1-bk)}</td><td>${1-bk>=PW?"Sí":"No"}</td></tr>`}
 $("tb").innerHTML=rows+"</table>";
}
$("mode").addEventListener("change",()=>{const d=$("mode").value==="D";$("efflab").textContent=d?"D (diferencia mínima)":"Στᵢ²";$("eff").value=d?15:1016.75});
$("go").addEventListener("click",run);
document.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")run()}));
run();
</script>
</body>
</html>
